<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Credits | Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">
    <style>
        .credits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .credit-card { background-color: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.5rem; transition: var(--transition); border: 1px solid rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .credit-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
        
        .customer-info { margin-bottom: 1rem; }
        .customer-name { font-size: 1.2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.25rem; display: flex; justify-content: space-between; align-items: center; }
        .customer-phone { font-size: 0.85rem; color: var(--gray); display: flex; align-items: center; gap: 0.5rem; }
        
        .credit-balance { font-size: 1.8rem; font-weight: 800; color: #8e44ad; margin: 1rem 0; display: flex; align-items: baseline; gap: 5px; }
        .credit-balance span { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; color: var(--gray); }
        
        .card-actions { display: flex; gap: 0.75rem; border-top: 1px solid #f0f2f5; padding-top: 1rem; }
        .card-actions .btn { flex: 1; padding: 10px; font-size: 0.85rem; font-weight: 700; }
        
        .control-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
        .search-wrapper { position: relative; flex-grow: 1; max-width: 500px; }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .search-input { width: 100%; padding: 12px 12px 12px 40px; border-radius: var(--radius-md); border: 2px solid #e0e6ed; background-color: var(--white); transition: var(--transition); font-weight: 500; }
        .search-input:focus { border-color: var(--primary); outline: none; }
        
        .empty-state { padding: 5rem; text-align: center; color: var(--gray); grid-column: 1 / -1; opacity: 0.6; }
        
        /* Modals */
        .custom-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 2rem; border-radius: var(--radius-lg); width: 95%; max-width: 450px; text-align: left; position: relative; transform: translateY(-20px); opacity: 0; transition: var(--transition); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .custom-modal.active .modal-content { transform: translateY(0); opacity: 1; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #f0f2f5; padding-bottom: 0.75rem; }
        .modal-title { font-size: 1.3rem; font-weight: 800; color: var(--dark); display: flex; align-items: center; gap: 10px; }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray); padding: 5px; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--dark); }
        .form-control { width: 100%; padding: 12px; border-radius: var(--radius-md); border: 2px solid #e0e6ed; transition: var(--transition); font-weight: 500; }
        .form-control:focus { border-color: var(--primary); outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; }
        .modal-btn { padding: 12px 24px; border-radius: var(--radius-md); border: none; cursor: pointer; font-weight: 700; transition: var(--transition); flex: 1; text-align: center; }
        .modal-btn-confirm { background: var(--primary); color: white; }
        .modal-btn-confirm:hover { opacity: 0.9; }
        .modal-btn-cancel { background: #f0f2f5; color: var(--dark); }
        .modal-btn-cancel:hover { background: #e4e6eb; }

        /* Statement Modal Specific */
        .statement-list { list-style: none; padding: 0; max-height: 350px; overflow-y: auto; }
        .statement-item { padding: 10px 0; border-bottom: 1px solid #f0f2f5; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: flex-start; }
        .statement-item:last-child { border-bottom: none; }
        .tx-left { display: flex; flex-direction: column; gap: 3px; }
        .tx-type { font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; width: fit-content; }
        .tx-type.addition { background: rgba(142, 68, 173, 0.1); color: #8e44ad; }
        .tx-type.payment { background: rgba(46, 204, 113, 0.1); color: var(--success); }
        .tx-date { font-size: 0.75rem; color: var(--gray); }
        .tx-desc { font-size: 0.85rem; color: var(--dark); margin-top: 3px; }
        .tx-amount { font-weight: 800; font-size: 1rem; text-align: right; }
        .tx-amount.addition { color: #8e44ad; }
        .tx-amount.payment { color: var(--success); }

        @media (max-width: 600px) {
            .credits-grid { grid-template-columns: 1fr; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: none; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="control-bar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchBox" placeholder="Search customer accounts...">
            </div>
            <button class="btn btn-primary" onclick="openRegisterModal()" style="width: auto; flex: none;">
                <i class="fas fa-user-plus"></i> Register Customer
            </button>
        </div>

        <div class="credits-grid" id="creditsContainer">
            <div style="text-align: center; padding: 5rem; opacity: 0.5; grid-column: 1 / -1;">
                <i class="fas fa-circle-notch fa-spin fa-3x"></i>
                <p style="margin-top: 1rem;">Loading credit records...</p>
            </div>
        </div>
    </main>

    <!-- Register Modal -->
    <div class="custom-modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-user-plus"></i> Register Customer</h3>
                <button class="close-btn" onclick="closeRegisterModal()">×</button>
            </div>
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="Enter customer's name">
            </div>
            <div class="form-group">
                <label for="regPhone">Contact Phone (Optional)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="Enter phone number">
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeRegisterModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="registerCustomer()">Register</button>
            </div>
        </div>
    </div>

    <!-- Record Payment Modal -->
    <div class="custom-modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-hand-holding-usd"></i> Record Payment</h3>
                <button class="close-btn" onclick="closePaymentModal()">×</button>
            </div>
            <div class="form-group">
                <p>Record cash payment received from <strong id="payCustomerName">...</strong>.</p>
                <p>Outstanding balance: <strong id="payCustomerBalance">Rs 0.00</strong></p>
            </div>
            <div class="form-group">
                <label for="payAmount">Amount Paid (Rs)</label>
                <input type="number" id="payAmount" class="form-control" placeholder="Enter payment amount" min="0" step="any">
            </div>
            <div class="form-group">
                <label for="payNote">Note (Optional)</label>
                <input type="text" id="payNote" class="form-control" placeholder="e.g., Cash payment at counter">
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closePaymentModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="submitPayment()" style="background-color: var(--success);">Record Payment</button>
            </div>
        </div>
    </div>

    <!-- Ledger Statement Modal -->
    <div class="custom-modal" id="statementModal" style="z-index: 2010;">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-file-invoice-dollar"></i> Customer Statement</h3>
                <button class="close-btn" onclick="closeStatementModal()">×</button>
            </div>
            <div style="margin-bottom: 1rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 1.1rem; font-weight: 700; color: var(--dark);" id="stmtCustomerName">...</span>
                <span style="font-size: 0.95rem; color: #8e44ad; font-weight: 800;">Owed: <span id="stmtOutstanding">Rs 0.00</span></span>
            </div>
            <div style="max-height: 350px; overflow-y: auto;">
                <ul class="statement-list" id="stmtList">
                    <!-- Loaded dynamically -->
                </ul>
            </div>
            <div class="modal-actions" style="margin-top: 1rem;">
                <button class="modal-btn modal-btn-cancel" onclick="closeStatementModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="admin-core.js"></script>
    <script src="auth.js"></script>
    <script src="credits.js"></script>
</body>
</html>
