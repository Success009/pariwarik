<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Order Entry | Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">

    <style>
        body {
            overflow-x: hidden;
        }

        .order-builder-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 400px;
            gap: 1.5rem;
            margin-top: 1rem;
            max-width: 100%;
        }

        /* Left Side: Menu Builder */
        .menu-builder {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 0;
        }
  
        .controls-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .search-input {
            width: 100%;
            padding: 10px 10px 10px 36px;
            border-radius: var(--radius-md);
            border: 2px solid #e0e6ed;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .category-tabs {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 5px;
            width: 100%;
        }

        .category-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .category-tabs::-webkit-scrollbar-thumb {
            background-color: #ddd;
            border-radius: 2px;
        }

        .cat-tab {
            padding: 6px 12px;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            border: none;
            color: var(--dark);
        }

        .cat-tab.active {
            background: var(--primary);
            color: white;
        }

        /* Compact Grid of Menu Cards */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .item-card {
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid #eef2f5;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
            user-select: none;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .item-card-img-wrapper {
            position: relative;
            width: 100%;
            height: 90px;
            background: #f8f9fa;
        }

        .item-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-card-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .item-card-info {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 0.25rem;
        }

        .item-card-name {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.2;
            height: 2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-card-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card-price {
            font-weight: 800;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .btn-add-item {
            background: rgba(67, 97, 238, 0.08);
            color: var(--primary);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.75rem;
        }

        .btn-add-item:hover {
            background: var(--primary);
            color: white;
        }

        /* Right Side: Cart Summary */
        .cart-wrapper {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 110px);
            position: sticky;
            top: 85px;
        }

        .cart-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.6rem;
            margin-bottom: 0.75rem;
        }

        .cart-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-clear-cart {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .btn-clear-cart:hover {
            background: rgba(231, 76, 60, 0.08);
        }

        .cart-form-group {
            margin-bottom: 0.75rem;
        }

        .cart-label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            color: var(--dark);
        }

        .cart-select, .cart-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            border: 2px solid #e0e6ed;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            background-color: white;
        }

        .cart-select:focus, .cart-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .cart-items-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 0.75rem;
            padding-right: 4px;
        }

        .cart-items-list::-webkit-scrollbar {
            width: 4px;
        }

        .cart-items-list::-webkit-scrollbar-thumb {
            background-color: #ddd;
            border-radius: 2px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #f0f2f5;
        }

        .cart-item-img {
            width: 35px;
            height: 35px;
            border-radius: 4px;
            object-fit: cover;
            background: #f8f9fa;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .cart-item-price {
            font-size: 0.7rem;
            color: var(--gray);
        }

        .cart-qty-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f0f2f5;
            padding: 3px 6px;
            border-radius: 20px;
        }

        .cart-qty-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--dark);
            border-radius: 50%;
            transition: var(--transition);
        }

        .cart-qty-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        .cart-qty-val {
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 12px;
            text-align: center;
        }

        .cart-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex: 1;
            color: var(--gray);
            opacity: 0.7;
            text-align: center;
            padding: 1.5rem;
        }

        .cart-empty-state i {
            font-size: 2rem;
        }

        .cart-summary-block {
            border-top: 2px solid #f0f2f5;
            padding-top: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            color: var(--dark);
            font-size: 1.05rem;
        }

        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .cart-actions .btn {
            width: 100%;
            justify-content: center;
            padding: 8px;
            font-size: 0.8rem;
            border-radius: var(--radius-md);
        }

        .btn-active-order { background-color: var(--primary); color: white; }
        .btn-completed-order { background-color: var(--success); color: white; }
        .btn-credit-order { background-color: #8e44ad; color: white; }

        /* Floating Cart Button for Mobile Screens */
        .cart-floating-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 1500;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .cart-floating-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(67, 97, 238, 0.4);
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .order-builder-container {
                grid-template-columns: 1fr;
            }
            .cart-floating-btn {
                display: inline-flex;
            }
            .cart-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 1550;
                backdrop-filter: blur(2px);
            }
            .cart-overlay.active {
                display: block;
            }
            .cart-wrapper {
                position: fixed;
                inset: auto 0 0 0;
                height: 75vh;
                max-height: 75vh;
                z-index: 1600;
                transform: translateY(100%);
                transition: var(--transition);
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            }
            .cart-wrapper.active {
                transform: translateY(0);
            }
            #closeCartDrawerBtn {
                display: inline-block !important;
            }
        }

        /* Modals and Overlays */
        .custom-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 420px;
            text-align: left;
            position: relative;
            transform: translateY(-20px);
            opacity: 0;
            transition: var(--transition);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .custom-modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 1.25rem;
            color: var(--dark);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.25rem;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            flex: 1;
            font-size: 0.85rem;
            text-align: center;
        }

        .modal-btn-confirm { background: var(--success); color: white; }
        .modal-btn-cancel { background: #f0f2f5; color: var(--dark); }

        .divider-label {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--primary);
            background: rgba(67, 97, 238, 0.08);
            padding: 3px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- Overlay for mobile bottom cart drawer -->
    <div class="cart-overlay" onclick="toggleCartDrawer()"></div>

    <!-- Floating action cart button for mobile -->
    <button class="cart-floating-btn" onclick="toggleCartDrawer()">
        <i class="fas fa-shopping-basket"></i>
        <span>View Order (<span id="floatingCartCount">0</span>)</span>
    </button>

    <main class="container">
        <div class="order-builder-container">
            <!-- Left Side: Menu List -->
            <div class="menu-builder">
                <div class="controls-row">
                    <h2 style="font-size: 1.2rem; font-weight: 800; color: var(--dark);"><i class="fas fa-utensils" style="color:var(--primary); margin-right:6px;"></i> Menu Items</h2>
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search dish name..." oninput="filterMenu()">
                    </div>
                </div>

                <div class="category-tabs" id="categoryTabs">
                    <button class="cat-tab active" onclick="selectCategory('All')">All Items</button>
                    <!-- Dynamically populated -->
                </div>

                <div class="items-grid" id="itemsGrid">
                    <div style="grid-column:1/-1; text-align: center; padding: 3rem; opacity: 0.5;">
                        <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                        <p style="margin-top: 1rem;">Loading menu items...</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Current Cart (Desktop: sidebar, Mobile: bottom slide-up drawer) -->
            <div class="cart-wrapper">
                <div class="cart-title-row">
                    <div class="cart-title">
                        <i class="fas fa-shopping-basket" style="color: var(--primary);"></i>
                        <span>New Order</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn-clear-cart" onclick="clearCart()">Clear All</button>
                        <button id="closeCartDrawerBtn" style="display: none; background: none; border: none; font-size: 1.4rem; color: var(--gray); cursor: pointer; padding: 0 4px;" onclick="toggleCartDrawer()">×</button>
                    </div>
                </div>

                <div class="cart-form-group">
                    <label class="cart-label">Table / Spot</label>
                    <select id="tableSelector" class="cart-select" onchange="handleTableChange(this.value)">
                        <!-- Dynamically populated tables list -->
                    </select>
                    <input type="text" id="customTableInput" class="cart-input" placeholder="Enter custom table/customer name" style="display:none; margin-top:0.4rem;" oninput="validateTableInput()">
                </div>

                <!-- Cart Items List -->
                <ul class="cart-items-list" id="cartItemsList">
                    <!-- Dynamic Cart Items -->
                </ul>

                <!-- Summary Section -->
                <div class="cart-summary-block">
                    <div class="cart-summary-row">
                        <span>Grand Total:</span>
                        <span id="grandTotalText">Rs 0.00</span>
                    </div>
                </div>



                <!-- Actions Grid -->
                <div class="cart-actions">
                    <button class="btn btn-primary btn-active-order" onclick="submitActiveOrder()" style="background-color: var(--primary); color: white;">
                        <i class="fas fa-paper-plane"></i> Send to Order
                    </button>
                </div>
  
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="admin-core.js"></script>
    <script src="auth.js"></script>
    <script src="manual-order.js"></script>
</body>
</html>
