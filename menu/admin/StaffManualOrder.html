<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Order Entry | Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">
    <style>
        .order-builder-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        @media (max-width: 992px) {
            .order-builder-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side: Menu Builder */
        .menu-builder {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .controls-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            min-width: 250px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: var(--radius-md);
            border: 2px solid #e0e6ed;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .category-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 5px;
            width: 100%;
        }

        .category-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .category-tabs::-webkit-scrollbar-thumb {
            background-color: #ddd;
            border-radius: 2px;
        }

        .cat-tab {
            padding: 8px 16px;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            border: none;
            color: var(--dark);
        }

        .cat-tab.active {
            background: var(--primary);
            color: white;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .item-card {
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid #eef2f5;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
            user-select: none;
        }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .item-card-img-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            background: #f8f9fa;
        }

        .item-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .item-card-info {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 0.5rem;
        }

        .item-card-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.3;
        }

        .item-card-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card-price {
            font-weight: 800;
            color: var(--primary);
            font-size: 1rem;
        }

        .btn-add-item {
            background: rgba(67, 97, 238, 0.08);
            color: var(--primary);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-add-item:hover {
            background: var(--primary);
            color: white;
        }

        /* Right Side: Cart Summary */
        .cart-wrapper {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 90px;
        }

        .cart-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }

        .cart-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear-cart {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .btn-clear-cart:hover {
            background: rgba(231, 76, 60, 0.08);
        }

        .cart-form-group {
            margin-bottom: 1rem;
        }

        .cart-label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--dark);
        }

        .cart-select, .cart-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 2px solid #e0e6ed;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            background-color: white;
        }

        .cart-select:focus, .cart-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .cart-items-list {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding-right: 4px;
        }

        .cart-items-list::-webkit-scrollbar {
            width: 4px;
        }

        .cart-items-list::-webkit-scrollbar-thumb {
            background-color: #ddd;
            border-radius: 2px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px dashed #f0f2f5;
        }

        .cart-item-img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            background: #f8f9fa;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .cart-item-price {
            font-size: 0.75rem;
            color: var(--gray);
        }

        .cart-qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0f2f5;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .cart-qty-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--dark);
            border-radius: 50%;
            transition: var(--transition);
        }

        .cart-qty-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        .cart-qty-val {
            font-size: 0.85rem;
            font-weight: 700;
            min-width: 15px;
            text-align: center;
        }

        .cart-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            color: var(--gray);
            opacity: 0.7;
            text-align: center;
            padding: 2rem;
        }

        .cart-empty-state i {
            font-size: 2.5rem;
        }

        .cart-summary-block {
            border-top: 2px solid #f0f2f5;
            padding-top: 1rem;
            margin-bottom: 1rem;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            color: var(--dark);
            font-size: 1.15rem;
        }

        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cart-actions .btn {
            width: 100%;
            justify-content: center;
            padding: 10px;
            font-size: 0.85rem;
        }

        .btn-active-order { background-color: var(--primary); color: white; }
        .btn-completed-order { background-color: var(--success); color: white; }
        .btn-credit-order { background-color: #8e44ad; color: white; }

        /* Modals and Overlays */
        .custom-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 450px;
            text-align: left;
            position: relative;
            transform: translateY(-20px);
            opacity: 0;
            transition: var(--transition);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .custom-modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--dark);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            flex: 1;
            font-size: 0.9rem;
            text-align: center;
        }

        .modal-btn-confirm { background: var(--success); color: white; }
        .modal-btn-cancel { background: #f0f2f5; color: var(--dark); }

        .divider-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--primary);
            background: rgba(67, 97, 238, 0.08);
            padding: 3px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="order-builder-container">
            <!-- Left Side: Menu List -->
            <div class="menu-builder">
                <div class="controls-row">
                    <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--dark);"><i class="fas fa-utensils" style="color:var(--primary); margin-right:6px;"></i> Menu Items</h2>
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search dish name..." oninput="filterMenu()">
                    </div>
                </div>

                <div class="category-tabs" id="categoryTabs">
                    <button class="cat-tab active" onclick="selectCategory('All')">All Items</button>
                    <!-- Dynamically populated -->
                </div>

                <div class="items-grid" id="itemsGrid">
                    <div style="grid-column:1/-1; text-align: center; padding: 3rem; opacity: 0.5;">
                        <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                        <p style="margin-top: 1rem;">Loading menu items...</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Current Cart -->
            <div class="cart-wrapper">
                <div class="cart-title-row">
                    <div class="cart-title">
                        <i class="fas fa-shopping-basket" style="color: var(--primary);"></i>
                        <span>New Order</span>
                    </div>
                    <button class="btn-clear-cart" onclick="clearCart()">Clear All</button>
                </div>

                <div class="cart-form-group">
                    <label class="cart-label">Table / Spot</label>
                    <select id="tableSelector" class="cart-select" onchange="handleTableChange(this.value)">
                        <option value="Table 1">Table 1</option>
                        <option value="Table 2">Table 2</option>
                        <option value="Table 3">Table 3</option>
                        <option value="Table 4">Table 4</option>
                        <option value="Table 5">Table 5</option>
                        <option value="Table 6">Table 6</option>
                        <option value="Table 7">Table 7</option>
                        <option value="Table 8">Table 8</option>
                        <option value="Table 9">Table 9</option>
                        <option value="Table 10">Table 10</option>
                        <option value="Table 11">Table 11</option>
                        <option value="Table 12">Table 12</option>
                        <option value="Table 13">Table 13</option>
                        <option value="Table 14">Table 14</option>
                        <option value="Table 15">Table 15</option>
                        <option value="Custom">Custom Name / Spot...</option>
                    </select>
                    <input type="text" id="customTableInput" class="cart-input" placeholder="Enter custom table/customer name" style="display:none; margin-top:0.5rem;" oninput="validateTableInput()">
                </div>

                <!-- Cart Items List -->
                <ul class="cart-items-list" id="cartItemsList">
                    <!-- Dynamic Cart Items -->
                </ul>

                <!-- Summary Section -->
                <div class="cart-summary-block">
                    <div class="cart-summary-row">
                        <span>Grand Total:</span>
                        <span id="grandTotalText">Rs 0.00</span>
                    </div>
                </div>

                <!-- Actions Grid -->
                <div class="cart-actions">
                    <button class="btn btn-primary btn-active-order" onclick="submitActiveOrder()">
                        <i class="fas fa-concierge-bell"></i> Send to Kitchen (Active)
                    </button>
                    <button class="btn btn-success btn-completed-order" onclick="submitCompletedDirectOrder()">
                        <i class="fas fa-check-double"></i> Complete & Pay (Cash)
                    </button>
                    <button class="btn btn-warning btn-credit-order" onclick="openCreditModal()">
                        <i class="fas fa-credit-card"></i> Complete & Add to Credit
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Credit Modal -->
    <div class="custom-modal" id="creditModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #f0f2f5; padding-bottom: 0.75rem;">
                <h3 class="modal-title" style="margin: 0; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--dark);"><i class="fas fa-credit-card" style="color:#8e44ad;"></i> Add Order to Credit</h3>
                <button type="button" onclick="closeCreditModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);">×</button>
            </div>
            
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--dark);">Select Credit Customer</label>
                <select id="creditPersonSelect" style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 2px solid #e0e6ed; background-color: var(--white); font-weight: 500; font-size: 0.95rem;">
                    <!-- Dynamically populated options -->
                </select>
            </div>
            
            <div style="display: flex; align-items: center; text-align: center; margin: 1.5rem 0; opacity: 0.8; width: 100%;">
                <div style="flex: 1; border-bottom: 1px dashed var(--primary); opacity: 0.2; margin-right: .75em;"></div>
                <span class="divider-label">OR CREATE NEW CUSTOMER</span>
                <div style="flex: 1; border-bottom: 1px dashed var(--primary); opacity: 0.2; margin-left: .75em;"></div>
            </div>
            
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--dark);">New Customer Name</label>
                <input type="text" id="newPersonName" placeholder="Enter customer name" style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 2px solid #e0e6ed; font-weight: 500; font-size: 0.95rem;">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--dark);">New Customer Phone (Optional)</label>
                <input type="tel" id="newPersonPhone" placeholder="Enter phone number" style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 2px solid #e0e6ed; font-weight: 500; font-size: 0.95rem;">
            </div>
            
            <div class="modal-actions">
                <button type="button" class="modal-btn modal-btn-cancel" onclick="closeCreditModal()">Cancel</button>
                <button type="button" class="modal-btn modal-btn-confirm" onclick="submitOrderToCredit()" style="background-color: #8e44ad; color: white;">Confirm Credit</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="admin-core.js"></script>
    <script src="auth.js"></script>
    <script src="manual-order.js"></script>
</body>
</html>
